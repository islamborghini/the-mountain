[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "the-mountain-protein"
version = "0.2.0"
description = "Standalone rank ensemble for protein insertion and deletion effects"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10,<3.14"
dependencies = ["numpy==2.2.6", "pandas==2.2.3", "scipy==1.15.3", "requests==2.32.5"]

[project.optional-dependencies]
inference = ["torch==2.8.0", "transformers==4.44.2"]
verification = ["scikit-learn==1.7.2"]
test = ["pytest==8.4.2"]

[project.scripts]
mountain-predict = "predict:main"
mountain-benchmark = "benchmark:main"
mountain-evaluate = "evaluate:main"
mountain-verify = "verify_official:main"

[tool.setuptools]
py-modules = ["model", "predict", "component_scoring", "benchmark", "evaluate", "verify_official"]
packages = ["reference"]

[tool.setuptools.package-data]
reference = ["*.csv", "*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
